[project]
name = "orman"
version = "0.1.0"
description = "Orman yangını yayılım modelleme: veri, simülasyon, doğrulama ve API"
readme = "README.md"
authors = [
    { name = "clssadik", email = "cillsadik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orman = "orman:main"
orman-veri = "orman.veri.bolge_paketi:main"
orman-model = "orman.model.calistir:main"
orman-dogrula = "orman.dogrulama.calistir:main"
orman-kalibre = "orman.dogrulama.kalibrasyon:main"
orman-senaryo-olc = "orman.dogrulama.senaryo_olcumu:main"
orman-duyarlilik = "orman.dogrulama.duyarlilik:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
